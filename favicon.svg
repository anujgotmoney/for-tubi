<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e82"/>
      <stop offset="100%" stop-color="#dc2650"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#801530" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- Feather / back of arrow -->
  <path d="M5 58 L19 44" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <path d="M6 51 L13 59 M10 47 L17 55" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Heart with Cupid's arrow -->
  <path filter="url(#shadow)" d="M32 55 C32 55 11 39.5 11 23.5 C11 13.8 18 8 25.5 8 C29.5 8 31.5 10 32 11.5 C32.5 10 34.5 8 38.5 8 C46 8 53 13.8 53 23.5 C53 39.5 32 55 32 55 Z" fill="url(#heartGrad)"/>
  
  <!-- Heart glossy shine highlight -->
  <path d="M17 19 C17 14 20.5 11 25.5 11" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Arrow shaft emerging through front of heart -->
  <path d="M37 24 L52 9" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Arrowhead piercing forward -->
  <polygon points="60,2 47,6 56,15" fill="#fef08a" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Subtle little sparkle -->
  <polygon points="26,24 28,29 33,31 28,33 26,38 24,33 19,31 24,29" fill="rgba(255,255,255,0.85)"/>
</svg>
